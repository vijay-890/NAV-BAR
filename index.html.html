<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url("img/bluebanner.jpg");
      background-position: center;
      background-attachment: fixed;
      background-size: cover;
      background-repeat: no-repeat;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .logo {
      color: rgba(255, 68, 0, 0.692);
      margin-left: 5%;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar ul {
      display: flex;
      gap: 30px;
    }

    .navbar ul li {
      list-style-type: none;
    }

    .navbar ul li a {
      text-decoration: none;
      padding: 50px;
      color: white;
      transition: 1.5s;
      padding: 0px 30px;
    }

    .navbar ul li a:hover {
      color: yellow;
      transform: translateX(0.5);
    }

    .inp {
      border: none;
      border: 1px solid orangered;
      border-right-style: none;
      border-radius: 3px;
      padding: 5px;
      box-shadow: transparent;
    }

    .search-btn {
      padding: 4px;
      width: 80px;
      border: none;
      border: 1px solid orangered;
      border-left-style: none;
      margin-right: 60px;
      background: orangered;
      border-radius: 3px;
      color: antiquewhite;
      margin-right: 500px;
      cursor: pointer;
    }

    .h1-web {
      color: white;
      margin-top: 8%;
      margin-left: 30px;
    }

    h1 span {
      color: orangered;
    }

    .para-web {
      margin-top: 20;
      margin-left: 30px;
      color: rgba(255, 255, 255, 0.541);
    }

    .join-btn {
      margin-top: 25px;
      margin-left: 50px;
      cursor: pointer;
    }

    .us-btn {
      background-color: orangered;
      width: 8%;
      border-radius: 9px;
      padding: 5px 0px;
      transition: 0.7s;
      cursor: pointer;
    }

    .us-btn:hover {
      transform: scaleX(0.8);
      color: whitesmoke;
    }

    .form {
      position: absolute;
      text-align: center;
      top: 50px;
      left: 75%;
      background-color: #000;
      width: 230px;
      height: 300px;
      margin-top: 50px;
      border-radius: 8px;
      padding: 0px 50px;

    }

    .btn-1 {
      background-color: white;
      width: 154px;
      height: 30px;
      margin-top: 9px;
      border-radius: 5px;
      color: gold;
      font-weight: bold;
      transition: 0.9s;
      position: fixed;
      right: 85px;
      cursor: pointer;
    }

    .btn-1:hover {
      transform: scaleX(0.9);
      background-color: rgba(253, 97, 40, 0.904);
      cursor: pointer;
    }

    .email-input {
      margin-top: 30px;
      border: none;
      background: transparent;
      color: white;
      font-weight: bold;
      border: 1px solid white;
      border-left-style: none;
      border-right-style: none;
      border-top-style: none;
      position: fixed;
      right: 80px;
      margin-top: 60px;
      cursor: pointer;
    }

    .pass-input {
      margin-top: 120px;
      border: none;
      border: 1px solid rgb(240, 233, 231);
      border-top-style: none;
      border-left-style: none;
      border-right-style: none;
      background: transparent;
      color: white;
      font-weight: bold;
      position: absolute;
      right: 30px;
      cursor: pointer;
    }

    .login-2btn {
      margin-top: 170px;
      padding: 5px 65px;
      width: 0px 90px;
      position: fixed;
      right: 80px;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.87);
      color: black;
      font-weight: bold;
      transition: 0.8s;
      cursor: pointer;

    }

    .login-2btn:hover {
      background-color: rgb(248, 84, 8);
      transform: translateX(1.8);
      cursor: pointer;
    }

    .para-1 {
      margin-top: 210px;
      color: white;
    }

    .para-1 a {
      text-decoration: none;
      color: rgba(255, 68, 0, 0.829);
    }

    .icons-div {
      color: white;
      margin-top: 6px;
    }

    .fa-brands {
      padding-top: 18px;
    }

    .icons{
      display: flex;
      flex-direction: column;
      cursor: pointer;
      padding: 1px 10px ;
           
    }

     @media (max-width: 768px) {

      body{background-attachment: scroll;
       } 

       .main-containerr{
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 10px;
      width: 100%;

    }

    }

    


      
  </style>
</head>

<body>
  <div class="main-containerr">
  <div class="maindiv">
    <div class="navbar">
      <div class="logo">
        <h2>PraRoz</h2>
      </div>

      <ul>
        <li><a href="#">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="service.html">SERVICE</a></li>
        <li><a href="design.html">DESIGN</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
      <div class="input-div">
        <input type="text" class="inp" id="first-input" placeholder="Type to Search" />
      </div>
      <div class="search-btn1">
        <button type="button" onclick="opened()" id="going" class="search-btn">
          Search
        </button>
      </div>
    </div>

    <div class="para-section">
      <div class="web-section">
        <h1 class="h1-web">
          Web Design & <br />
          <span>Development</span><br />
          Course

      </div>

      <p class="para-web">

        <br />

        design elements
      </p>

      <div class="join-btn">
        <button onclick="joinus()" class="us-btn" id="us-btn1">
          join us
        </button>
      </div>
    </div>
    <!-- web section end -->
  </div>
  <div class="form">
    <div class="log-btn">
      <button onclick="clickhere()" type="button" class="btn-1">
        Login Here
      </button>
    </div>

    <div class="input">
      <input type="text" id="input-value" class="email-input" placeholder="Enter Email Here" />
    </div>
    <div class="input-2">
      <input type="number" id="input-value1" class="pass-input" placeholder="Enter Password" />
    </div>

    <div class="login1">
      <div class="login1-btn">
        <button onclick="alearting()" type="button" class="login-2btn">

        </button>
      </div>

    <div class="footer">
      <div>
        <h5 class="para-1">
          Don't have an account? <br />
          <a href="https://www.google.com">Sign up</a> here
        </h5>
      </div>
    </div>

    <div>
      <div class="icons">
        <h6 class="icons-div">
          Log in With <br />
          <a href="https://m.facebook.com">
            <i class="fa-brands fa-facebook"></i></a>
          <a href="https://www.instagram.com">
            <i class="fa-brands fa-instagram"></i></a>
          <a href="https://x.com"> <i class="fa-brands fa-twitter"></i> </a>
          <a href="https://www.google.com"><i class="fa-brands fa-google"></i></a>
          <a href="https://www.secure.skype.com"><i class="fa-brands fa-skype"></i></a>
        </h6>
      </div>
    </div>
  </div>
  </div>

      const id = document
        .getElementById("us-btn1")
        .addEventListener("click", function () {
          window.location.href = "https://www.w3schools.com/";

    }

        window.location.href = "https://www.w3schools.com/";

  </script>
</body>

</html>
